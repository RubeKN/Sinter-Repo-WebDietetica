<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel · Sinter Natural</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <meta name="theme-color" content="#213f2f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css?v=bulk">
</head>
<body>
  <!-- Ingreso -->
  <section class="login" id="login" hidden>
    <form class="login__card" id="loginForm" novalidate>
      <div class="login__brand"><img src="img/logo-96.png" width="40" height="40" alt=""> <span>SINTER</span></div>
      <h1>Panel de administración</h1>
      <p class="login__sub">Gestioná productos, precios, pedidos y tu tienda desde un solo lugar.</p>
      <label class="field">Email<input type="email" name="email" autocomplete="username" required></label>
      <label class="field">Contraseña<input type="password" name="pass" autocomplete="current-password" required></label>
      <p class="login__error" id="loginError" hidden></p>
      <button class="btn btn--primary btn--block" type="submit">Ingresar</button>
      <div class="login__demo">
        <b>Acceso de demostración</b>
        <span id="demoCreds"></span>
        <button type="button" class="btn btn--ghost btn--sm" id="fillDemo">Completar datos</button>
      </div>
      <a class="login__back" href="./">← Volver a la tienda</a>
    </form>
  </section>

  <!-- Panel -->
  <div class="shell" id="shell" hidden>
    <aside class="side" id="side">
      <a class="side__brand" href="#/inicio"><img src="img/logo-96.png" width="30" height="30" alt=""> <span>SINTER</span><small>Panel</small></a>
      <nav class="side__nav" id="sideNav"></nav>
      <div class="side__foot">
        <a class="side__link" href="./" target="_blank" rel="noopener"><span class="ico" data-ico="store"></span>Ver tienda</a>
        <button class="side__link" type="button" id="resetDemo"><span class="ico" data-ico="reset"></span>Restablecer demo</button>
      </div>
    </aside>
    <div class="side-overlay" id="sideOverlay" hidden></div>

    <div class="main">
      <header class="top">
        <button class="top__menu" type="button" id="menuBtn" aria-label="Abrir menú"><span class="ico" data-ico="menu"></span></button>
        <h1 class="top__title" id="pageTitle">Inicio</h1>
        <span class="badge-demo" title="Los cambios se guardan solo en este navegador">Modo demo</span>
        <div class="top__user">
          <span class="top__avatar" id="avatar">A</span>
          <div class="top__who"><b id="userName">Administrador</b><small id="userEmail"></small></div>
          <button class="btn btn--ghost btn--sm" type="button" id="logoutBtn">Salir</button>
        </div>
      </header>
      <main class="content" id="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js?v=bulk"></script>
  <script src="js/db.js?v=bulk"></script>
  <script src="js/admin.js?v=bulk"></script>
  <script src="js/scale.js?v=bulk"></script>
</body>
</html>
